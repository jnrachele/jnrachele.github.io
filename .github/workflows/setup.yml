name: Set up site
# Unpacks jnrachele-website.zip and copies the PDFs and photo from the old Wix site.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/setup.yml"
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the site
        run: |
          if [ -f jnrachele-website.zip ]; then
            unzip -o jnrachele-website.zip -x '.github/*' -d .
            git rm -q jnrachele-website.zip
          fi
      - name: Copy files from Wix
        run: |
          tail -n +2 file-manifest.csv | tr -d '\r' | while IFS=, read -r url path; do
            mkdir -p "$(dirname "$path")"
            if curl -fsSL --retry 3 -A "Mozilla/5.0" -o "$path" "$url"; then echo "ok      $path"; else echo "FAILED  $url"; fi
          done
          echo "Files copied: $(find files -type f | wc -l)"
      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site and copy files from Wix" || echo "Nothing to save"
          git push
